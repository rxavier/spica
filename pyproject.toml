[project]
name = "spica"
version = "0.11.0"
description = "Spica: multi-station internet radio from a local library, with a leather-and-brass face"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "mutagen>=1.47",
]

[dependency-groups]
# Tests only: no test may reach the network, a model, or a real station.
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is not installed as a package: the tests import it from the source tree.
pythonpath = ["."]
addopts = "-q"

[tool.uv]
package = false
