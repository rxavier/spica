# Overlay for audio analysis. The default worker image carries the picker's half
# (numpy) plus ffmpeg; this runs the worker on the image that also has onnxruntime
# and essentia (and ffmpeg, for the loudness job).
#
#   docker compose -f compose.yaml -f compose.analysis.yaml up -d
#
# Set SPICA_ANALYSIS=1 in .env. The picker keeps the lean image and reads the vectors.
# The analysis image is amd64 only: essentia has no Linux arm64 wheel.
services:
  worker:
    image: ghcr.io/rxavier/spica:${SPICA_TAG:-0.15.4}-analysis
    platform: linux/amd64
